server:
  port: 8080

spring:
  application:
    name: flash-sale
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/flash_sale?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 12345678
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      connection-timeout: 3000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 500ms
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      table-underline: true

seckill:
  # 本地开发默认值，生产必须用环境变量覆盖（requirement 7.4）
  admin-token: ${ADMIN_TOKEN:dev-only-token-please-change-0123456789abcdef}
  enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  level:
    com.xianglong.flashsale: info
