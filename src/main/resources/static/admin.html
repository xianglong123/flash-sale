<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>闪购秒杀 · 管理端</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e4e6eb; --txt:#1a1c20; --sub:#6b7280; --key:#1f6feb; --danger:#e4393c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .top h1 { font-size:17px; margin:0; }
  .top a { font-size:13px; color:var(--sub); text-decoration:none; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  h2 { font-size:14px; margin:0 0 12px; color:var(--sub); font-weight:600; letter-spacing:.5px; }
  label { display:block; font-size:12px; color:var(--sub); margin:10px 0 6px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px; font-size:14px;
          background:#fff; outline:none; }
  input:focus { border-color:var(--key); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
  .btns { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
  button { padding:10px 18px; border:0; border-radius:9px; font-size:14px; cursor:pointer;
           background:var(--key); color:#fff; font-weight:600; }
  button.ghost { background:#fff; color:var(--txt); border:1px solid var(--line); font-weight:400; }
  button.danger { background:var(--danger); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .out { margin-top:12px; font-size:12px; color:var(--sub); white-space:pre-wrap; word-break:break-all;
         background:#fafbfc; border:1px dashed var(--line); border-radius:9px; padding:10px; min-height:40px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:9px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--sub); font-weight:500; font-size:12px; }
  .tip { font-size:12px; color:var(--sub); line-height:1.7; }
  code { background:#f0f1f3; padding:1px 5px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>闪购秒杀 · 管理端</h1>
    <a href="/">← 展示页</a>
  </div>

  <div class="card">
    <h2>管理员令牌</h2>
    <input id="token" type="password" placeholder="X-Admin-Token（默认 dev-only-token...）">
    <div class="btns">
      <button class="ghost" id="saveToken">保存到本次会话</button>
    </div>
    <div class="out" id="tokenOut">令牌只存在 sessionStorage，关闭标签页即失效。</div>
  </div>

  <div class="card">
    <h2>新建活动</h2>
    <div class="grid">
      <div><label>商品名称</label><input id="itemName" value="小米 15 Ultra"></div>
      <div><label>价格</label><input id="price" value="5999.00"></div>
      <div><label>库存数量</label><input id="stock" type="number" value="1000"></div>
      <div><label>持续时长（秒）</label><input id="duration" type="number" value="60"></div>
    </div>
    <div class="btns">
      <button id="create">创建活动</button>
    </div>
    <div class="out" id="createOut">创建后状态为 NOT_STARTED，点「启动」才开始计时。</div>
  </div>

  <div class="card">
    <h2>操作活动</h2>
    <div class="grid">
      <div><label>活动 ID</label><input id="sid" type="number" value="1"></div>
      <div><label>调整后总库存</label><input id="newStock" type="number" value="1000"></div>
    </div>
    <div class="btns">
      <button id="start">启动</button>
      <button class="ghost" id="setStock">修改库存</button>
      <button class="danger" id="end">结束</button>
      <button class="ghost" id="refresh">刷新列表</button>
      <button class="ghost" id="openPage">打开活动页</button>
    </div>
    <div class="out" id="opOut">进行中只允许增加库存，减少会被拒绝（STOCK_DECREASE_FORBIDDEN）。</div>
  </div>

  <div class="card">
    <h2>活动列表</h2>
    <table>
      <thead><tr><th>ID</th><th>状态</th><th>总库存</th><th>剩余</th><th>时间窗</th></tr></thead>
      <tbody id="listBody"><tr><td colspan="5" class="tip">点「刷新列表」加载</td></tr></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let token = sessionStorage.getItem('fs_admin_token') || '';

  if (token) { $('token').value = token; }

  function setOut(el, text) { $(el).textContent = text; }

  $('saveToken').addEventListener('click', () => {
    token = $('token').value.trim();
    if (!token) { setOut('tokenOut', '令牌不能为空'); return; }
    sessionStorage.setItem('fs_admin_token', token);
    setOut('tokenOut', '已保存到 sessionStorage，长度 ' + token.length);
  });

  async function api(method, path, body) {
    const headers = { 'X-Admin-Token': token };
    if (body) headers['Content-Type'] = 'application/json';
    const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (res.status === 401) {
      sessionStorage.removeItem('fs_admin_token');
      token = '';
      throw new Error('令牌无效或缺失，请重新输入');
    }
    if (!res.ok) throw new Error((data && (data.message || data.code)) || ('HTTP ' + res.status));
    return data;
  }

  $('create').addEventListener('click', async () => {
    try {
      const body = {
        itemName: $('itemName').value.trim(),
        price: $('price').value.trim(),
        totalStock: Number($('stock').value),
        durationSeconds: Number($('duration').value)
      };
      const r = await api('POST', '/api/admin/seckill', body);
      $('sid').value = r.data.seckillId;
      $('newStock').value = r.data.totalStock;
      setOut('createOut', JSON.stringify(r.data, null, 2));
      list();
    } catch (e) { setOut('createOut', '失败：' + e.message); }
  });

  $('start').addEventListener('click', async () => {
    try {
      const r = await api('POST', '/api/admin/seckill/' + $('sid').value + '/start');
      setOut('opOut', JSON.stringify(r.data, null, 2));
      list();
    } catch (e) { setOut('opOut', '失败：' + e.message); }
  });

  $('setStock').addEventListener('click', async () => {
    try {
      const r = await api('PUT', '/api/admin/seckill/' + $('sid').value + '/stock',
        { totalStock: Number($('newStock').value) });
      setOut('opOut', JSON.stringify(r.data, null, 2));
      list();
    } catch (e) { setOut('opOut', '失败：' + e.message); }
  });

  $('end').addEventListener('click', async () => {
    try {
      const r = await api('POST', '/api/admin/seckill/' + $('sid').value + '/end');
      setOut('opOut', JSON.stringify(r.data, null, 2));
      list();
    } catch (e) { setOut('opOut', '失败：' + e.message); }
  });

  $('openPage').addEventListener('click', () => {
    window.open('/?id=' + $('sid').value, '_blank');
  });

  async function list() {
    try {
      const r = await api('GET', '/api/admin/seckill');
      const tb = $('listBody');
      tb.innerHTML = '';
      if (!r.data.length) {
        tb.innerHTML = '<tr><td colspan="5" class="tip">还没有活动</td></tr>';
        return;
      }
      r.data.forEach((s) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${s.seckillId}</td><td>${s.status}</td><td>${s.totalStock}</td>`
          + `<td>${s.availableStock}</td>`
          + `<td>${String(s.startTime).replace('T',' ')} ~ ${String(s.endTime).replace('T',' ')}</td>`;
        tb.appendChild(tr);
      });
    } catch (e) {
      $('listBody').innerHTML = '<tr><td colspan="5" class="tip">加载失败：' + e.message + '</td></tr>';
    }
  }

  $('refresh').addEventListener('click', list);
})();
</script>
</body>
</html>
